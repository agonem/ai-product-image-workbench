name: Code, contracts and migrations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install locked dependencies
        run: |
          npm --prefix frontend ci --no-fund
          uv sync --frozen --project image-service
      - name: Check, test and build
        run: python scripts/check.py
      - name: Start services and check HTTP
        run: python scripts/smoke.py
      - name: Save test and startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            business-service/target/surefire-reports/
            .artifacts/smoke/
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: workbench_test
          POSTGRES_USER: workbench_test
          # Disposable CI fixture, never a production credential.
          POSTGRES_PASSWORD: ci-disposable-test-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench_test -d workbench_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_TEST_URL: jdbc:postgresql://127.0.0.1:5432/workbench_test
      DB_TEST_USER: workbench_test
      DB_TEST_PASSWORD: ci-disposable-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify PostgreSQL migrations and constraints
        working-directory: business-service
        run: bash mvnw -B -ntp -Pdatabase-tests verify
      - name: Save database test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-diagnostics
          path: business-service/target/failsafe-reports/
          retention-days: 7
