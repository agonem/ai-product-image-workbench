[project]
name = "product-image-service"
version = "0.1.0"
description = "Internal image-service HTTP shell; no image algorithms or provider yet"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pydantic==2.13.5",
    "referencing==0.37.0",
    "rfc3339-validator==0.1.4",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
